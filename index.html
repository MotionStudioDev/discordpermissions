*{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{--accent:#f5c518;--bg:#121314;--card:#1a1b1e}
body{background:var(--bg);color:#dbdee1;font-family:Whitney,"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15px;min-height:100vh;overflow-x:hidden}
body::before{display:none}
/* LOADER */
#loader{position:fixed;inset:0;background:#0c0d0f;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .35s,visibility .35s}
#loader.done{opacity:0;visibility:hidden}
#loader img{width:72px;height:72px;object-fit:cover;border-radius:18px}
#loader .lt{color:#fff;font-weight:700;font-size:16px;letter-spacing:3px}
#loader .lt span{color:var(--accent)}
#loader .bar{width:140px;height:2px;background:#222326;border-radius:99px;overflow:hidden}
#loader .bar i{display:block;height:100%;width:30%;background:var(--accent);border-radius:99px;animation:load 0.9s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-140%)}100%{transform:translateX(470%)}}
#loader .sub,#loader .pct{display:none}
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:8px 16px;background:#0b0c0e;border-bottom:1px solid #1e1f22}
.top img{width:32px;height:32px;object-fit:cover;border-radius:50%;background:#000;border:2px solid var(--accent)}
.top .name{color:#fff;font-weight:700;font-size:16px}
.top .name span{color:var(--accent)}
.lang-picker{position:relative}
.lang-btn{background:transparent;color:#dbdee1;border:0;border-radius:8px;padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;white-space:nowrap}
.lang-btn:hover{background:rgba(255,255,255,.07)}
.lang-btn svg{opacity:.85}
.lang-btn .chev{transition:.2s;font-size:9px;opacity:.5}
.lang-picker.open .lang-btn{background:rgba(255,255,255,.09)}
.lang-picker.open .lang-btn .chev{transform:rotate(180deg)}
.lang-menu{position:absolute;right:0;top:calc(100% + 8px);background:#111214;border:1px solid #2a2b30;border-radius:12px;min-width:190px;padding:6px;box-shadow:0 16px 40px rgba(0,0,0,.6);opacity:0;visibility:hidden;transform:translateY(-6px);transition:.16s ease;z-index:100}
.lang-picker.open .lang-menu{opacity:1;visibility:visible;transform:none}
.lang-menu .mtitle{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#77787c;padding:8px 10px 4px}
.lang-item{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;color:#c4c6ca;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:14px;text-align:left}
.lang-item:hover{background:#1e1f22;color:#fff}
.lang-item.active{color:#fff}
.lang-item .tick{margin-left:auto;opacity:0;font-size:13px;color:var(--accent);font-weight:800}
.lang-item.active .tick{opacity:1}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn-gold{background:linear-gradient(135deg,#f5c518,#ff8a00);border:0;color:#000;font-weight:700;border-radius:8px;padding:8px 14px;cursor:pointer;transition:transform .15s ease}
.btn-gold:hover{transform:translateY(-1px)}
.btn-gold:active{transform:translateY(0) scale(.97)}
.wrap{max-width:1120px;margin:0 auto;padding:18px 18px 44px;position:relative;animation:pageIn .45s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.calc-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.calc{font-family:Consolas,Menlo,monospace;color:#dbdee1;font-size:14px;background:#1a1b1e;border:1px solid #26272b;padding:10px 14px;border-radius:10px;display:inline-block;margin:0}
.risk-pill{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:9px 13px;border-radius:99px;border:1px solid #2a2b30;background:#1a1b1e;color:#b9bbbe;transition:background-color .15s ease}
.risk-pill .dot{width:9px;height:9px;border-radius:50%;background:#57F287}
.risk-pill.low .dot{background:#57F287}.risk-pill.med .dot{background:#FEE75C}.risk-pill.high .dot{background:#ED9121}.risk-pill.crit .dot{background:#ED4245;animation:blink 1s ease infinite}
@keyframes blink{50%{opacity:.35}}
.risk-pill.low{border-color:#1f3d2b}.risk-pill.med{border-color:#4d4420}.risk-pill.high{border-color:#5a3a17}.risk-pill.crit{border-color:#5c2326;color:#fff}
.admin-warn{margin:0 0 12px;background:rgba(237,66,69,.1);border:1px solid #ED4245;border-radius:10px;padding:11px 13px;color:#ffb3b5;font-size:13.5px;font-weight:600;animation:warnIn .25s ease}
@keyframes warnIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.calc code{color:var(--accent);font-weight:700}
.calc.bump{animation:bump .22s ease}
@keyframes bump{30%{transform:scale(1.03)}}
.cols{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:2px}
@media(min-width:760px){.cols{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--card);border:1px solid #1e1f22;border-radius:12px;padding:14px;animation:cardIn .4s ease both}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
@keyframes cardIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.cols h2{color:#fff;font-size:17px;font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.cols h2::before{content:'';width:8px;height:8px;border-radius:99px;background:var(--accent)}
.row{display:flex;align-items:center;gap:10px;padding:5px 6px;cursor:pointer;border-radius:6px;transition:background-color .12s ease,transform .12s ease}
.row:hover{background:#222327;transform:translateX(2px)}
.row:active{transform:translateX(2px) scale(.995)}
.box{width:18px;height:18px;min-width:18px;border:2px solid #80848e;border-radius:4px;position:relative;background:transparent;transition:transform .15s ease,background-color .15s ease,border-color .15s ease}
.row.on .box{background:var(--accent);border-color:var(--accent)}
.row.on .box::after{content:'';position:absolute;left:4px;top:1px;width:5px;height:9px;border:solid #000;border-width:0 2px 2px 0;transform:rotate(45deg)}
.row.pop .box{animation:pop .22s ease}
@keyframes pop{40%{transform:scale(1.25)}}
.lbl{user-select:none}
.lbl.orange{color:#f26522}
.note{margin:0;color:#a8a9ad;font-size:13.5px;line-height:1.5;background:#1a1b1e;border:1px solid #26272b;border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px}
.note a{color:var(--accent);text-decoration:none}
.bottom-card{margin-top:16px;background:var(--card);border:1px solid #26272b;border-radius:14px;padding:20px 18px 18px}
h2.invite{color:#fff;font-size:20px;margin:16px 0 6px;padding-top:2px;display:flex;align-items:center;gap:10px}
h2.invite::before{content:'';width:8px;height:8px;border-radius:99px;background:var(--accent)}
.ichecks{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 4px}
.pill{border:1px solid #3a3b40;border-radius:99px;padding:8px 14px;font-size:13.5px}
.pill:hover{border-color:var(--accent)}
.row.on.pill{border-color:var(--accent);background:rgba(245,197,24,.1)}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:#77787c;margin:14px 0 6px}
.field input[type=text]{background:#101114;border:1px solid #2a2b30;color:#fff;outline:0;padding:11px 12px;font-size:14px;font-family:Consolas,monospace;width:320px;max-width:100%;border-radius:10px;transition:.15s}
.field input[type=text]:focus{border-color:var(--accent)}
.field input.error{border-color:#f04747}
.invite-link{margin-top:12px;word-break:break-all;font-size:12.5px;font-family:Consolas,monospace;background:#0e0f11;border:1px dashed #3a3b40;padding:12px;border-radius:10px}
.invite-link a{color:#57a5ff;text-decoration:none}
.invite-link.flash{animation:flash .3s ease}
@keyframes flash{from{opacity:.3}to{opacity:1}}
.invite-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.abtn{background:#2b2d31;border:1px solid #3a3b40;color:#fff;border-radius:9px;padding:9px 14px;cursor:pointer;font-size:13.5px;font-weight:600;transition:transform .15s ease,background-color .15s ease}
.abtn:hover{background:#35373c;transform:translateY(-1px)}
.abtn:active{transform:scale(.97)}
.abtn.gold{background:var(--accent);border-color:var(--accent);color:#000}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.mini{margin-top:16px;padding-top:14px;border-top:1px solid #26272b;display:flex;flex-wrap:wrap;gap:8px}
.mini input{flex:1;min-width:200px;background:#101114;border:1px solid #2a2b30;color:#dbdee1;border-radius:9px;padding:9px 11px;font-family:Consolas,monospace;font-size:13px}
.mini button{background:#2b2d31;border:1px solid #3a3b40;color:#dbdee1;border-radius:9px;padding:9px 13px;cursor:pointer;font-size:13px;font-weight:600}
.mini button:hover{background:#35373c;color:#fff}
.mini button:first-of-type{background:#2b2d31;border-color:var(--accent);color:var(--accent)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#111214;border:1px solid var(--accent);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:.3s;z-index:1000}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none}
[dir=rtl] .row{flex-direction:row-reverse}
</style>
</head>

const lvl=isAdmin||score>=60?4:score>=30?3:score>=10?2:score>0?1:0;
const pill=document.getElementById("riskPill"),rt=document.getElementById("riskTxt");
if(pill&&rt){const names=RISK_TXT[lang]||RISK_TXT.en;rt.textContent=(lvl===0?names[0]:names[lvl]+" · "+danger);pill.className="risk-pill "+(lvl===1?"low":lvl===2?"med":lvl===3?"high":lvl===4?"crit":"");}
const aw=document.getElementById("adminWarn");if(aw){if(isAdmin){aw.textContent=ADMIN_TXT[lang]||ADMIN_TXT.en;aw.classList.remove("hidden");}else aw.classList.add("hidden");}
}
function toggleScopes(){needScopes=!needScopes;document.getElementById("rowScopes").classList.toggle("on",needScopes);document.getElementById("scopeField").classList.toggle("hidden",!needScopes);recalculate();}
function toggleCode(){needCode=!needCode;document.getElementById("rowCode").classList.toggle("on",needCode);recalculate();}
function sync(v){try{const x=BigInt(v||"0");PERMS.forEach(p=>{if(p.v)state[p.id]=(x&p.v)===p.v;});build();}catch(e){}recalculate(true);}
function applyReverse(){const e=document.getElementById("reverseInput");if(!e)return;sync(e.value.trim());}
function preset(k){PERMS.forEach(p=>{if(p.v)state[p.id]=(k==="admin"&&p.id==="administrator");});build();recalculate();}
function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),1400);}
async function copyDec(){try{await navigator.clipboard.writeText(document.getElementById("number").textContent);toast(t().copied);}catch(e){}}
async function copyInvite(){try{await navigator.clipboard.writeText(document.getElementById("invite").textContent);toast(t().copied);}catch(e){}}
function openInvite(){const u=document.getElementById("invite").href;if(u&&u.startsWith("http"))window.open(u,"_blank");}
function getHash(){const h=location.hash;return h&&h.length>1?h.substring(1):null;}
function buildLangMenu(){const m=document.getElementById("langMenu");m.innerHTML=`<div class="mtitle">Language</div>`;Object.keys(L).forEach(k=>{const b=document.createElement("button");b.className="lang-item"+(k===lang?" active":"");b.innerHTML=`<span>${L[k].name}</span><span class="tick">✓</span>`;b.onclick=(e)=>{e.stopPropagation();document.getElementById("langPicker").classList.remove("open");setLang(k);};m.appendChild(b);});}
function toggleLangMenu(e){e.stopPropagation();document.getElementById("langPicker").classList.toggle("open");}
document.addEventListener("click",()=>{const p=document.getElementById("langPicker");if(p)p.classList.remove("open");});
buildLangMenu();
applyLang();
const h=getHash();if(h&&/^\d+$/.test(h))sync(h);
setTimeout(()=>document.getElementById("loader").classList.add("done"),700);
</script>
</body>
</html>
